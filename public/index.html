<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Etsy Poster Generator</title>
    <style>
      :root {
        --ink: #1c1917;
        --muted: #57534e;
        --line: #d6d3d1;
        --bg: #f5f0e8;
        --panel: #fffcf7;
        --accent: #0f766e;
        --accent-hover: #0d9488;
        --danger: #b91c1c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Georgia, serif;
        color: var(--ink);
        background:
          radial-gradient(ellipse at top, #efe6d6 0%, transparent 55%),
          linear-gradient(180deg, #f7f2ea 0%, #ebe4d8 100%);
      }

      main {
        width: min(760px, calc(100% - 2rem));
        margin: 2.5rem auto 3rem;
      }

      h1 {
        margin: 0 0 0.35rem;
        font-size: 1.85rem;
        letter-spacing: -0.02em;
      }

      .lead {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.45;
      }

      form {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 1.25rem;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.5rem;
      }

      textarea {
        width: 100%;
        min-height: 280px;
        resize: vertical;
        padding: 0.85rem 1rem;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: 0.95rem/1.45 ui-monospace, Consolas, monospace;
        color: var(--ink);
        background: #fff;
      }

      textarea:focus {
        outline: 2px solid color-mix(in srgb, var(--accent) 45%, white);
        border-color: var(--accent);
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-top: 1rem;
      }

      button {
        appearance: none;
        border: 0;
        border-radius: 8px;
        padding: 0.7rem 1.2rem;
        background: var(--accent);
        color: #fff;
        font: 600 0.95rem/1 "Segoe UI", sans-serif;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--accent-hover);
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      #status {
        margin-top: 1rem;
        min-height: 1.4rem;
        color: var(--muted);
      }

      #status.error {
        color: var(--danger);
      }

      #results {
        margin-top: 1.5rem;
      }

      #results h2 {
        margin: 0 0 0.75rem;
        font-size: 1.15rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 0.85rem;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
      }

      .card img {
        display: block;
        width: 100%;
        aspect-ratio: 3 / 4;
        object-fit: cover;
        background: #e7e5e4;
      }

      .card p {
        margin: 0;
        padding: 0.55rem 0.7rem;
        font-size: 0.85rem;
      }

      .hint {
        margin-top: 0.75rem;
        font-size: 0.85rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Poster generator</h1>
      <p class="lead">
        Paste a structured prompt (Generate N images, Style, Colors, Composition,
        Subjects, Format), then submit. Images save to <code>output/</code>.
      </p>

      <form id="form">
        <label for="prompt">Prompt</label>
        <textarea
          id="prompt"
          name="prompt"
          spellcheck="true"
          required
        >Generate 3 vertical poster images for a coordinated set of woodland nursery wall art.
Style: soft vintage storybook style.
Colors: muted sage green, cream, rust, and warm brown.
Composition: centered compositions, clean cream background, no text, no watermark.
Subjects: a friendly-looking fox, a friendly-looking bear, and a friendly-looking deer.
Format: 18x24 inches at 300 DPI, suitable for nursery wall art.</textarea>
        <div class="actions">
          <button type="submit" id="submit">Submit</button>
        </div>
        <p class="hint">
          Generation can take several minutes. Keep this tab open until it finishes.
        </p>
      </form>

      <p id="status" aria-live="polite"></p>
      <section id="results" hidden>
        <h2>Results</h2>
        <div class="grid" id="grid"></div>
      </section>
    </main>

    <script>
      const form = document.getElementById("form");
      const promptEl = document.getElementById("prompt");
      const submitBtn = document.getElementById("submit");
      const statusEl = document.getElementById("status");
      const resultsEl = document.getElementById("results");
      const gridEl = document.getElementById("grid");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const prompt = promptEl.value.trim();
        if (!prompt) return;

        submitBtn.disabled = true;
        statusEl.classList.remove("error");
        statusEl.textContent = "Generating… this can take a few minutes.";
        resultsEl.hidden = true;
        gridEl.innerHTML = "";

        try {
          const response = await fetch("/api/generate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt }),
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.error || "Generation failed");
          }

          const files = data.files || [];
          const errors = data.errors || [];
          statusEl.textContent =
            "Done. Generated " +
            files.length +
            " of " +
            data.count +
            " image(s)." +
            (errors.length ? " Some slots failed — see console/server logs." : "");

          if (files.length) {
            resultsEl.hidden = false;
            for (const file of files) {
              const card = document.createElement("div");
              card.className = "card";
              const img = document.createElement("img");
              img.src = "/output/" + encodeURIComponent(file) + "?t=" + Date.now();
              img.alt = file;
              const caption = document.createElement("p");
              caption.textContent = file;
              card.appendChild(img);
              card.appendChild(caption);
              gridEl.appendChild(card);
            }
          }

          if (errors.length) {
            statusEl.classList.add("error");
            statusEl.textContent += " Errors: " + errors.join(" | ");
          }
        } catch (err) {
          statusEl.classList.add("error");
          statusEl.textContent = err instanceof Error ? err.message : String(err);
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
