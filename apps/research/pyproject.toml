[project]
name = "etsy-posters-research"
version = "1.0.0"
description = "Etsy niche research pipeline for etsy-posters monorepo"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "playwright>=1.40",
  "python-dotenv>=1.0",
  "pydantic>=2.0",
  "replicate>=0.25",
]

[project.scripts]
research-pipeline = "research_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["research_pipeline*"]
